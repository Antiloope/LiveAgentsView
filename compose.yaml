# Shared services — production images / local base.
# Development overrides in compose.dev.yaml

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-liveagents}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-liveagents}
      POSTGRES_DB: ${POSTGRES_DB:-liveagents}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-liveagents}"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  pgdata:
