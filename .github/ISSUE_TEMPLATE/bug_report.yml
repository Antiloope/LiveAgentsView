name: Bug report
description: Reportar un comportamiento incorrecto
title: "[bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Gracias por reportar. Revisá [docs/06-status.md](../docs/06-status.md) por si el comportamiento ya está documentado.

  - type: textarea
    id: description
    attributes:
      label: Qué pasó
      description: Descripción clara del bug
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Pasos para reproducir
      placeholder: |
        1. ...
        2. ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Comportamiento esperado
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Entorno
      description: OS, versión de Docker, commit o tag
    validations:
      required: false
