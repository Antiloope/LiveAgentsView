# LiveAgentsView daemon. Docker is for developing/running this locally
# without installing Go or Node. Only adopted-mode hooks work against this
# containerized daemon (HTTP in, SQLite out, no host access needed); piloted
# sessions spawn `claude`/`agent` against the host's real filesystem and
# login state, which needs the daemon running natively — see
# scripts/lav-service-install.sh.
#
# Development overrides (host config bind mounts, needed for `lav init`) are
# in compose.dev.yaml.
#
#   docker compose up --build                        # just run the daemon
#   docker compose -f compose.yaml -f compose.dev.yaml run --rm lav lav init
#
# Prefer scripts/dev-up.sh and scripts/lav-init.sh over typing these by hand.

services:
  lav:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      # Bound to loopback only: a server that can approve permissions is RCE
      # if exposed. Docker's default port publish binds 0.0.0.0, which would
      # expose it, so it is pinned to 127.0.0.1 explicitly here.
      - "127.0.0.1:${LAV_PORT:-8420}:8420"
    environment:
      LAV_PORT: "8420"
    restart: unless-stopped
    volumes:
      # SQLite lives at ~/.liveagentsview on the host, bind-mounted straight
      # through rather than a Docker named volume, so it is
      # inspectable/backup-able like any other local file.
      - ${HOME}/.liveagentsview:/data
