name: Feature request
description: Propose an improvement or new functionality
title: "[feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Unagreed product proposals go in `docs/05-ideas-to-discuss.md`.
        This issue is for discussion before opening a PR.

  - type: textarea
    id: problem
    attributes:
      label: Problem or need
      description: What problem it solves or what value it adds
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: How you would solve it (high level)
    validations:
      required: true

  - type: dropdown
    id: scope
    attributes:
      label: Does it touch product definition?
      options:
        - Not sure
        - Yes — needs a maintainer decision
        - No — implements something already decided
    validations:
      required: true
