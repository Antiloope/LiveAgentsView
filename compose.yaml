# LiveAgentsView daemon. Docker is for developing/running this locally
# without installing Go or Node — see docs/03-decisions.md 2026-09-01 and
# apps/lav/README.md for why the daemon itself is fine to run in a
# container even though the *shipped, piloted-mode* binary is not.
#
# Development overrides (host config bind mounts, needed for `lav init`) are
# in compose.dev.yaml.
#
#   docker compose up --build                        # just run the daemon
#   docker compose -f compose.yaml -f compose.dev.yaml run --rm lav lav init
#
# Prefer scripts/dev-up.sh and scripts/lav-init.sh over typing these by hand.

services:
  lav:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      # Bound to loopback only, per the decided boundary (docs/02-scope.md,
      # "Explicit boundaries": a server that can approve permissions is RCE
      # if exposed — Docker's default port publish binds 0.0.0.0, which
      # would violate that, so it is pinned to 127.0.0.1 explicitly here.
      - "127.0.0.1:${LAV_PORT:-8420}:8420"
    environment:
      LAV_PORT: "8420"
    restart: unless-stopped
    volumes:
      # SQLite lives at ~/.liveagentsview on the host, per the stack
      # decision — bind-mounted straight through rather than a Docker
      # named volume, so it is inspectable/backup-able like any other
      # local file and a future native (non-Docker) build reads the same data.
      - ${HOME}/.liveagentsview:/data
